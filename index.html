<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#7C3AED" />
<!-- Prevent white flash between native splash and HTML splash by painting the
     root background the exact same purple as the native splash + manifest. -->
<style>html,body{background-color:#7C3AED;margin:0;padding:0;}</style>
<meta name="description" content="NeuroZen — Train your brain with 10 science-inspired games. Build focus, memory, logic & speed. Free, offline, no account needed." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="NeuroZen" />
<meta name="mobile-web-app-capable" content="yes" />
<title>NeuroZen — Train Your Brain</title>
<link rel="icon" href="/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<link rel="manifest" href="/manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<style>
  #appSplash{
    position:fixed;inset:0;z-index:99999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    /* Start at exactly #7C3AED so the very first visible pixel matches the
       native Android splash + manifest background_color — zero visible seam. */
    background: linear-gradient(160deg, #04030C 0%, #0A0520 40%, #0D1B4B 100%);
    transition:opacity .4s ease, visibility .4s ease;
  }
  #appSplash.splash-hide{opacity:0;visibility:hidden;pointer-events:none;}
  #appSplash .sp-icon{
    width:96px;height:96px;border-radius:24px;overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
    animation:spPulse 1.8s ease-in-out infinite;
  }
  #appSplash .sp-icon img{width:100%;height:100%;display:block;}
  #appSplash .sp-word{
    margin-top:22px;font-family:'Poppins',sans-serif;font-weight:800;font-size:26px;
    color:#fff;letter-spacing:.3px;
  }
  #appSplash .sp-tag{
    margin-top:4px;font-family:'Poppins',sans-serif;font-weight:500;font-size:13px;
    color:rgba(255,255,255,.78);letter-spacing:.5px;
  }
  #appSplash .sp-bar{
    margin-top:34px;width:120px;height:4px;border-radius:4px;
    background:rgba(255,255,255,.22);overflow:hidden;
  }
  #appSplash .sp-bar-fill{
    height:100%;width:40%;border-radius:4px;background:#fff;
    animation:spLoad 1.1s ease-in-out infinite;
  }
  @keyframes spPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.06);}}
  @keyframes spLoad{0%{transform:translateX(-120%);}100%{transform:translateX(280%);}}
  @media (prefers-reduced-motion: reduce){
    #appSplash .sp-icon{animation:none;}
    #appSplash .sp-bar-fill{animation:none;width:70%;}
  }
</style>
<div id="appSplash">
  <div class="sp-icon"><img src="/icon-192.png" alt="NeuroZen" /></div>
  <div class="sp-word">NeuroZen</div>
  <div class="sp-tag">TRAIN YOUR BRAIN</div>
  <div class="sp-bar"><div class="sp-bar-fill"></div></div>
</div>

<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="achToast" class="ach-unlock-toast"></div>
<div id="comboBadge" class="combo-badge"></div>
<script src="js/app.js"></script>
<script src="js/shared.js"></script>
<script src="js/games/schulte.js"></script>
<script src="js/games/memory.js"></script>
<script src="js/games/pattern.js"></script>
<script src="js/games/wordflash.js"></script>
<script src="js/games/wordchain.js"></script>
<script src="js/games/math.js"></script>
<script src="js/games/stroopx.js"></script>
<script src="js/games/iqtest.js"></script>
<script src="js/games/reactionlab.js"></script>
<script src="js/games/spatialspin.js"></script>
<script>
  /* Wait for the app to finish first paint before fading the splash, so the
     handoff hides the loading work instead of revealing a partially-styled page.
     Total visible splash time ≈ max(load, 480ms) then 400ms fade-out. */
  (function(){
    var splash=document.getElementById('appSplash');
    if(!splash)return;
    var hidden=false;
    function hide(){
      if(hidden)return;hidden=true;
      splash.classList.add('splash-hide');
      setTimeout(function(){if(splash.parentNode)splash.parentNode.removeChild(splash);},420);
    }
    var minMs=480;
    var started=Date.now();
    function trigger(){
      var elapsed=Date.now()-started;
      var wait=Math.max(0,minMs-elapsed);
      setTimeout(hide,wait);
    }
    if(document.readyState==='complete')trigger();
    else window.addEventListener('load',trigger,{once:true});
    /* Safety net: never let the splash stick around longer than 3s if 'load' is slow */
    setTimeout(hide,3000);
  })();
</script>
<script>
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('/sw.js').then(reg=>{
        reg.onupdatefound=()=>{
          const installingWorker=reg.installing;
          if(installingWorker){
            installingWorker.onstatechange=()=>{
              if(installingWorker.state==='installed'&&navigator.serviceWorker.controller){
                const el=document.getElementById('toast');
                if(el){el.textContent='🔄 NeuroZen updated! Reload for latest version.';el.classList.add('show');setTimeout(()=>el.classList.remove('show'),4000);}
              }
            };
          }
        };
      }).catch(err=>{
        console.warn('⚠️ Service worker registration failed:',err.message);
      });
    });
  }
</script>
</body>
</html>
